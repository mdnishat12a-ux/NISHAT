name: Build Nishat AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v6

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "Using: $ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          ROOT=$(find project -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Add Kotlin support
        run: |
          cd "$PROJECT_ROOT"
          sed -i "s/id 'com.android.application' version '8.7.3' apply false/id 'com.android.application' version '8.7.3' apply false\n    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false/" build.gradle
          sed -i "/id 'com.android.application'/a\\    id 'org.jetbrains.kotlin.android'" app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NishatAI-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
